name: Deriv SDK CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version:
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install package
        run: pip install -e .

      - name: Install development tools
        run: |
          pip install ruff
          pip install mypy
          pip install pytest
          pip install pytest-cov

      - name: Run Ruff
        run: ruff check .

      - name: Run MyPy
        run: mypy deriv_sdk

      - name: Run Tests
        run: pytest

      - name: Run Coverage
        run: pytest --cov=deriv_sdk --cov-report=term